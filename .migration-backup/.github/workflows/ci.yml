name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python dependencies and linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run linter (flake8)
        run: |
          flake8 --max-line-length=120 .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
  
  integration-test:
    name: "Integration & E2E Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [lint, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend dependencies for test runner
        working-directory: frontend
        run: npm ci
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production-like Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: concierge-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            INSTALL_FULL_REQUIREMENTS=1
            BUILD_FRONTEND=1
      - name: Run backend services with Docker Compose
        run: |
          export APP_VERSION=ci
          # Start all services except the frontend dev server, which is now built into the app image.
          docker-compose up -d --scale frontend=0
      - name: Wait for 'app' service to be healthy
        run: |
          echo "Waiting for 'app' service to be healthy..."
          for i in {1..60}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' quesarc_app 2>/dev/null)
            if [ "$status" == "healthy" ]; then echo "App container is healthy."; exit 0; fi
            echo "App container status: $status. Waiting... (${i}/60)"
            sleep 2
          done
          echo "App container did not become healthy."
          docker-compose logs
          exit 1
      - name: Run container smoke checks
        run: python3 scripts/check_endpoints.py --base-url http://localhost:8000
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        working-directory: frontend
        run: |
          npx playwright install --with-deps
      - name: Run Playwright E2E
        working-directory: frontend
        env:
          # Point tests to the backend, which now serves the built frontend
          BASE_URL: http://localhost:8000
        run: npm run test:e2e
      - name: Stop and remove container
        if: always()
        run: |
          docker-compose logs
          docker-compose down -v --remove-orphans || true
