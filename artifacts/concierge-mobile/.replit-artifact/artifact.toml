kind = "mobile"
previewPath = "/concierge-mobile/"
title = "Concierge AI Mobile"
version = "1.0.0"
id = "artifacts/concierge-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/concierge-mobile/" ]
localPort = 20957

[services.development]
run = "pnpm --filter @workspace/concierge-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/concierge-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/concierge-mobile", "run", "serve" ]

[services.env]
PORT = "20957"
BASE_PATH = "/concierge-mobile/"
