kind = "web"
previewPath = "/"
title = "Concierge AI"
version = "1.0.0"
id = "artifacts/concierge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20721

[services.development]
run = "pnpm --filter @workspace/concierge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/concierge", "run", "build" ]
publicDir = "artifacts/concierge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20721"
BASE_PATH = "/"

[[services]]
name = "api"
paths = [ "/api", "/media", "/ws", "/health" ]
localPort = 8000

[services.development]
run = "cd /home/runner/workspace && uvicorn app:app --host 0.0.0.0 --port 8000"
