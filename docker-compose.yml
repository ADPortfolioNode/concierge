    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/_health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Redis (optional — only started with --profile full) ───────────────────
  redis:
    profiles: [full]
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
