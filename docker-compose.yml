# Concierge AI — Clean Docker Compose (matches current Dockerfile + app.py)
#
# Quick start (recommended):
#   docker compose up --build
#
# With background workers (Redis + Celery):
#   docker compose --profile full up --build
#
# The Dockerfile builds the React frontend (pnpm) and bundles it into the
# Python image. The FastAPI app serves both the API and the SPA on port 8000.
#
# Copy .env.example → .env and set at least one LLM key (OPENAI_API_KEY or GEMINI_API_KEY).

x-env: &env
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GROK_API_KEY: ${GROK_API_KEY:-}
  PORT: "8000"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  # Disable noisy Chroma telemetry (cosmetic only)
  ANONYMIZED_TELEMETRY: "false"
  CHROMA_TELEMETRY: "false"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: concierge-ai:latest
    container_name: concierge_api
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      <<: *env
      # Allow local dev frontends
      CORS_ALLOW_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,http://localhost:${HOST_PORT:-8000},http://127.0.0.1:${HOST_PORT:-8000}"
    volumes:
      - media_data:/app/media
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/_health')"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    # command overridden only for local source reloads (bind mount in dev)
    # default CMD in Dockerfile is fine for production-like runs

  # Optional distributed task execution
  redis:
    profiles: ["full"]
    image: redis:7-alpine
    container_name: concierge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    profiles: ["full"]
    image: concierge-ai:latest
    container_name: concierge_worker
    command: celery -A tasks.main_tasks worker --loglevel=${LOG_LEVEL:-info} --concurrency=${CELERY_CONCURRENCY:-4} --queues=celery,default,timeline
    environment:
      <<: *env
      PYTHONPATH: /app
    volumes:
      - media_data:/app/media
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional monitoring (only with full profile)
  flower:
    profiles: ["full"]
    image: concierge-ai:latest
    container_name: concierge_flower
    command: ["celery", "-A", "tasks.celery_app", "flower", "--port=5555"]
    environment:
      <<: *env
      PYTHONPATH: /app
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  media_data:
  app_data:
  redis_data:

# Note: For live frontend development (Vite HMR) run separately:
#   pnpm install
#   pnpm --filter @workspace/concierge dev
# (it proxies /api to localhost:8000) while running uvicorn or the api container.
